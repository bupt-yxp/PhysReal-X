[build-system]
requires = ["editables==0.5", "hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "physreal-x"
dynamic = ["version"]
description = "A contract-first platform for reproducible embodied-AI simulation and data generation."
readme = "README.md"
requires-python = ">=3.8,<3.13"
license = "MIT AND Apache-2.0 AND LicenseRef-ArtGS-Research-Only AND LicenseRef-NVIDIA-Research"
license-files = [
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "algorithms/artgs/LICENSE",
  "algorithms/artgs/submodules/diff-gaussian-rasterization/LICENSE.md",
  "algorithms/artgs/submodules/simple-knn/LICENSE.md",
  "algorithms/act/LICENSE",
  "algorithms/dinov2/LICENSE",
  "algorithms/dino_wm/LICENSE",
  "algorithms/scenesmith/LICENSE",
  "algorithms/dtart/LICENSE",
  "algorithms/dtart/mycuda/torch_ngp_grid_encoder/LICENSE",
]
authors = [
  { name = "PhysReal-X Contributors" },
]
keywords = ["embodied-ai", "robotics", "simulation", "synthetic-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "eval-type-backport>=0.2.2,<1; python_version < '3.10'",
  "pydantic>=2.9,<2.11; python_version == '3.8'",
  "pydantic>=2.9,<3; python_version >= '3.9'",
  "PyYAML>=6.0.2,<7",
  "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
physical = [
  "numpy==1.26.4; python_version >= '3.10'",
  "scipy==1.13.1; python_version >= '3.10'",
  "trimesh==4.5.1; python_version >= '3.10'",
  "coacd==1.0.9; python_version >= '3.10'",
  "rtree==1.4.1; python_version >= '3.10'",
  "mujoco==3.3.7; python_version >= '3.10'",
  "PyOpenGL==3.1.10; python_version >= '3.10'",
  "usd-core==24.11; python_version >= '3.10'",
]
train = [
  "numpy==1.24.4; python_version == '3.8'",
  "numpy==1.26.4; python_version >= '3.9'",
  "safetensors>=0.4.5,<0.5; python_version == '3.8'",
  "safetensors>=0.4.5,<1; python_version >= '3.9'",
]
visual-learning = [
  "einops==0.8.1; python_version >= '3.10'",
  "torchvision==0.20.1; python_version >= '3.10'",
]
dev = [
  "build>=1.2.2,<2",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6; python_version == '3.8'",
  "pytest-cov>=6,<7; python_version >= '3.9'",
  "ruff>=0.8,<1",
  "twine>=6,<7",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
]
demo = [
  "jupyterlab>=4.2,<5; python_version >= '3.9'",
  "ipykernel>=6.29,<7; python_version >= '3.10'",
  "nbclient>=0.10,<0.11; python_version >= '3.10'",
  "matplotlib>=3.8,<4; python_version >= '3.10'",
]
colmap = [
  "numpy==1.26.4; python_version >= '3.10' and python_version < '3.13'",
  "opencv-python==4.10.0.84; python_version >= '3.10' and python_version < '3.13'",
  "pycolmap==4.1.1; python_version >= '3.10' and python_version < '3.13'",
]
dtart = [
  "numpy==1.26.4",
  "scipy==1.13.1",
  "trimesh==4.5.1",
  "open3d==0.18.0",
  "opencv-python==4.10.0.84",
  "pycolmap==4.1.1",
  "imageio==2.34.1",
  "scikit-image==0.22.0",
  "scikit-learn==1.5.0",
  "joblib>=1.4,<2",
  "PyYAML>=6,<7",
  "ninja>=1.11,<2",
  "torch==2.5.1",
  "kaolin==0.18.0",
  "kornia==0.7.3",
  "ruamel.yaml==0.18.6",
  "mesh-to-sdf==0.0.15",
  "pyrender @ git+https://github.com/mmatl/pyrender.git@a59963ef890891656fd17c90e12d663233dcaa99",
  "wandb==0.19.10",
  "ipykernel==6.29.5",
]
artgs = [
  "imageio==2.34.1; python_version >= '3.10' and python_version < '3.13'",
  "joblib>=1.4,<2; python_version >= '3.10' and python_version < '3.13'",
  "lpips==0.1.4; python_version >= '3.10' and python_version < '3.13'",
  "matplotlib>=3.8,<4; python_version >= '3.10' and python_version < '3.13'",
  "moviepy==1.0.3; python_version >= '3.10' and python_version < '3.13'",
  "ninja>=1.11,<2; python_version >= '3.10' and python_version < '3.13'",
  "numpy==1.26.4; python_version >= '3.10' and python_version < '3.13'",
  "open3d==0.18.0; python_version >= '3.10' and python_version < '3.13'",
  "opencv-python==4.10.0.84; python_version >= '3.10' and python_version < '3.13'",
  "pandas>=2.2,<3; python_version >= '3.10' and python_version < '3.13'",
  "piq==0.8.0; python_version >= '3.10' and python_version < '3.13'",
  "plyfile==1.0.3; python_version >= '3.10' and python_version < '3.13'",
  "pytransform3d==3.16.0; python_version >= '3.10' and python_version < '3.13'",
  "pytorch-lightning==2.4.0; python_version >= '3.10' and python_version < '3.13'",
  "pytorch3d @ git+https://github.com/facebookresearch/pytorch3d.git@e73a7e7bfc580d1f9225ad9ff7d2c753c320aabd ; python_version >= '3.10' and python_version < '3.13'",
  "scikit-image==0.22.0; python_version >= '3.10' and python_version < '3.13'",
  "scikit-learn==1.5.0; python_version >= '3.10' and python_version < '3.13'",
  "scipy==1.13.1; python_version >= '3.10' and python_version < '3.13'",
  "seaborn==0.13.2; python_version >= '3.10' and python_version < '3.13'",
  "setuptools>=68,<81; python_version >= '3.10' and python_version < '3.13'",
  "tensorboard==2.16.2; python_version >= '3.10' and python_version < '3.13'",
  "tinycudann @ git+https://github.com/NVlabs/tiny-cuda-nn.git@749dd70c5afc5a9dadb85e5652ed65d55e0ba187#subdirectory=bindings/torch ; python_version >= '3.10' and python_version < '3.13'",
  "torch==2.5.1; python_version >= '3.10' and python_version < '3.13'",
  "torchvision==0.20.1; python_version >= '3.10' and python_version < '3.13'",
  "tqdm>=4.66,<5; python_version >= '3.10' and python_version < '3.13'",
  "trimesh==4.5.1; python_version >= '3.10' and python_version < '3.13'",
]

[project.scripts]
physrealx = "physrealx.cli:main"

[tool.hatch.version]
path = "src/physrealx/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
dev-mode-dirs = ["src", "."]
exclude = [
  "**/__pycache__/**",
  "**/*.egg-info/**",
  "**/*.o",
  "**/*.py[cod]",
  "**/*.so",
  "**/build/**",
  "**/dist/**",
  "/examples/**/input/**",
  "/examples/**/output/**",
  "/algorithms/artgs/assets/**",
  "/algorithms/dtart/weights/**",
  "/algorithms/artgs/vis_utils/**",
  "/algorithms/artgs/submodules/diff-gaussian-rasterization/third_party/glm/doc/**",
  "/algorithms/artgs/submodules/diff-gaussian-rasterization/third_party/glm/test/**",
]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/THIRD_PARTY_NOTICES.md",
  "/docs",
  "/examples",
  "/algorithms",
  "/environment.yml",
  "/mkdocs.yml",
  "/overrides",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
only-include = ["src/physrealx", "algorithms"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"algorithms" = "physrealx/_embedded"

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "physrealx/_embedded/THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
]
testpaths = ["tests"]
markers = [
  "gpu: requires a usable CUDA GPU and compatible extensions in the current environment",
  "integration: exercises more than one platform component",
  "real_data: opt-in execution with the local real capture dataset and Jupyter kernel",
]

[tool.coverage.run]
branch = true
source = ["physrealx"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
target-version = "py38"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
  "algorithms",
  "examples/real_assets_and_digital_twin/input/ArtModeling",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["B008"]
allowed-confusables = ["，", "：", "；"]

[tool.ruff.lint.per-file-ignores]
# Notebook bootstrap verifies the selected Conda kernel before SDK imports.
"examples/**/*.ipynb" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["physrealx"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
# Formatting an accepted Notebook would invalidate its byte-level execution receipt.
# Notebook code remains linted; format it before an acceptance run when intentionally edited.
exclude = ["examples/**/*.ipynb"]

[tool.mypy]
files = ["src/physrealx"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy.*", "trimesh.*", "mujoco.*", "pxr.*", "coacd.*", "isaacsim.*",
    "carb", "omni.*"]
ignore_missing_imports = true
