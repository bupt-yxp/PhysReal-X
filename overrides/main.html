{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% set social_title = page.title if page else config.site_name %}
  {% set social_description = page.meta.description if page and page.meta and page.meta.description else config.site_description %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PhysReal-X">
  <meta property="og:title" content="{{ social_title }} · PhysReal-X">
  <meta property="og:description" content="{{ social_description }}">
  <meta property="og:image" content="{{ config.site_url }}assets/images/social.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ social_title }} · PhysReal-X">
  <meta name="twitter:description" content="{{ social_description }}">
  <meta name="twitter:image" content="{{ config.site_url }}assets/images/social.png">
{% endblock %}
