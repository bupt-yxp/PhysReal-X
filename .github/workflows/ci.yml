name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            torch-version: "2.4.1+cpu"
            numpy-version: "1.24.4"
          - python-version: "3.9"
            torch-version: "2.5.1+cpu"
            numpy-version: "1.26.4"
          - python-version: "3.10"
            torch-version: "2.5.1+cpu"
            numpy-version: "1.26.4"
          - python-version: "3.11"
            torch-version: "2.5.1+cpu"
            numpy-version: "1.26.4"
          - python-version: "3.12"
            torch-version: "2.5.1+cpu"
            numpy-version: "1.26.4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==${{ matrix.torch-version }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --editable ".[dev,train]"
          python -c "import torch; assert torch.__version__ == '${{ matrix.torch-version }}'; assert torch.version.cuda is None"
          python -c "import numpy; assert numpy.__version__ == '${{ matrix.numpy-version }}'"

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy

      - name: Run CPU test suite
        run: >-
          python -m pytest -m "not gpu"
          --cov=physrealx
          --cov-config=${{ github.workspace }}/pyproject.toml
          --cov-report=term-missing
          --cov-report=xml

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Smoke-test installed wheel
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python -c "import physrealx; print(physrealx.__version__)"
          .wheel-smoke/bin/python -m pip check

  physical:
    name: Physical pipeline (Python 3.10)
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install rendering and exact geometry dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri build-essential libcgal-dev libgmp-dev libmpfr-dev
      - name: Install the unified physical environment
        run: |
          python -m pip install torch==2.5.1+cpu torchvision==0.20.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,physical,train,colmap,visual-learning,demo]'
      - name: Verify complete CPU suite including actual physics and rendering
        run: python -m pytest -m 'not gpu' --cov=physrealx --cov-branch --cov-fail-under=80
