[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "physrealx-external-workers"
version = "0.2.0"
description = "Isolated protocol adapters for external algorithms used by PhysReal-X."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
dependencies = ["physreal-x==0.1.0"]

[project.scripts]
physrealx-worker-coacd = "physrealx_workers.coacd_worker:main"
physrealx-worker-colmap = "physrealx_workers.colmap_worker:main"
physrealx-worker-metric-alignment = "physrealx_workers.metric_alignment_worker:main"
physrealx-worker-ditto = "physrealx_workers.ditto_worker:main"
physrealx-worker-mujoco-sysid = "physrealx_workers.mujoco_sysid_worker:main"
physrealx-worker-omnidc = "physrealx_workers.omnidc_worker:main"
physrealx-worker-openusd = "physrealx_workers.openusd_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/physrealx_workers"]

[tool.hatch.build.targets.sdist]
include = ["LICENSE", "README.md", "pyproject.toml", "src", "install.py", "requirements"]
