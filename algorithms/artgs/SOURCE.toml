[[adaptations]]
id = "explicit-output-paths"
description = "移除由数据路径推导模型路径和修改源码配置 JSON 的行为。"

[[adaptations]]
id = "optional-ground-truth"
description = "无关节真值时明确跳过真值指标，不用宽泛异常吞掉执行错误。"

[[adaptations]]
id = "metric-depth-uint8-fix"
description = "修正 RGB 图像转换使用有符号 byte 导致的像素溢出。"

[[adaptations]]
id = "platform-source-root"
description = "训练和渲染均接收平台物化的数据根目录，不依赖仓库内 data 符号链接。"

[[adaptations]]
id = "explicit-checkpoint-and-holdout"
description = "按已发布迭代读取粗训练权重，导出固定最终迭代；所有训练阶段排除留出视角，关节真值不参与模型选择。"

[[adaptations]]
id = "continuous-heldout-rendering"
description = "使用上游 interpolate 在实际留出相机渲染五个连续状态，无场景专用相机轨迹；运动组数按采集的可观测运动设置。"

[[adaptations]]
id = "foreground-quality-and-observed-motion"
description = "增加真实前景掩码内 PSNR 和预测轮廓 IoU，避免背景掩盖重建误差；导出的起止运动幅度与机械关节极限分开表述。"

[[adaptations]]
id = "identifiable-joint-axis"
description = "以带轴向约束的最小二乘替代必然奇异的 I-R 求逆；正确组合两次半程刚体变换，拒绝零运动轴；已提供的关节真值出错时不再静默跳过。"

[[adaptations]]
id = "portable-model-configuration"
description = "模型配置统一读写 JSON，删除 eval/Namespace 文件兼容；几何包保存重载所需的网络和渲染配置，排除临时目录；形变权重按 weights_only 模式读取。"

[[adaptations]]
id = "bounded-evaluation-device-memory"
description = "评估图像、深度和掩码在 CPU 累积，逐帧上 GPU 计算外观指标；即时加载的相机在渲染后释放到 CPU，避免显存随视图数量线性增长。"

[[adaptations]]
id = "cpu-training-images-device-safe-rasterization"
description = "训练图片留在 CPU，逐帧传输；渲染器将相机矩阵显式传到高斯所在设备，避免原生 CUDA 算子误读 CPU 指针。"

[[adaptations]]
id = "state-specific-metric-initialization"
description = "两个观测状态分别使用其训练视图的米制 RGB-D 点云初始化粗模型，避免共享混合状态几何污染运动分解。"

[[adaptations]]
id = "metric-depth-joint-prediction"
description = "两部件类型预测与联合重建均由两状态粗运动点云初始化对称刚体变换，并统一使用粗点云及有效前景米制深度；发布实际分类旋转量。"

[[adaptations]]
id = "scalar-joint-export"
description = "关节运动量以显式标量导出，避免依赖已弃用的 NumPy 单元素数组隐式转换。"

[[adaptations]]
id = "reference-depth-initialization"
description = "可选地以训练视图的掩膜米制深度和已提供 USD 表面完成带验证视图门禁的坐标配准，并将观测状态间刚体运动转换为 ArtGS 对称半程初始化；报告明确标记模型条件化。"
