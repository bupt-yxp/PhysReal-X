site_name: PhysReal-X
site_description: 连接数字孪生、物理仿真、多模态数据与机器人学习的统一平台
site_url: https://bupt-yxp.github.io/PhysReal-X/
repo_url: https://github.com/bupt-yxp/PhysReal-X
repo_name: GitHub

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  font: false
  custom_dir: overrides
  logo: assets/images/brand-mark.png
  favicon: assets/images/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

nav:
  - 首页: index.md
  - 入门:
      - 平台概览: getting-started/index.md
      - 安装与环境: getting-started/installation.md
      - 快速开始: getting-started/quickstart.md
      - 第一个可复现契约实验: getting-started/first-project.md
  - 用户指南:
      - 指南总览: user-guide/index.md
      - 功能验收与证据范围: acceptance.md
      - 真实资产接入与数字孪生: user-guide/real-assets-and-digital-twin.md
      - 物理可信资产构建: user-guide/physical-assets.md
      - 场景与任务生成: user-guide/scenes-and-tasks.md
      - 物理仿真与多模态数据生成: user-guide/simulation-and-data-generation.md
      - 数据管理与模型训练: user-guide/data-management-and-training.md
      - 评测与真机反馈闭环: user-guide/evaluation-and-feedback.md
  - API 文档:
      - API 总览: api/index.md
      - 客户端与公共约定: api/client.md
      - 技术能力与方法 API: api/capability-methods.md
      - 内嵌方法:
          - ArtGS 视觉几何重建: api/artgs.md
          - DTArt 几何与运动重建: api/dtart.md
      - 资产 API: api/assets.md
      - 场景与任务 API: api/scenes-and-tasks.md
      - 运行与数据生成 API: api/runs.md
      - 数据集 API: api/datasets.md
      - 训练 API: api/training.md
      - 评测、部署与反馈 API: api/evaluation-deployment-feedback.md
      - 领域模型: api/models.md
      - 命令行: api/cli.md
      - 错误、状态与幂等: api/errors.md

plugins:
  - search:
      lang:
        - zh

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/toc-sync.js

copyright: Copyright &copy; 2026 PhysReal-X · MIT 许可证
