site_name: PhysReal-X
site_description: 连接数字孪生、物理仿真、多模态数据与机器人学习的统一平台
site_url: https://bupt-yxp.github.io/PhysReal-X/
repo_url: https://github.com/bupt-yxp/PhysReal-X
repo_name: GitHub
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  font: false
  custom_dir: overrides
  logo: assets/images/brand-mark.png
  favicon: assets/images/favicon-v2.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

nav:
  - 首页: index.md
  - 入门:
      - 平台概览: getting-started/index.md
      - 安装与环境: getting-started/installation.md
      - 快速开始: getting-started/quickstart.md
      - 第一个完整项目: getting-started/first-project.md
  - 用户指南:
      - 指南总览: user-guide/index.md
      - 资产与数字孪生: user-guide/assets.md
      - 场景与任务: user-guide/scenes-and-tasks.md
      - 仿真运行与后端: user-guide/simulation.md
      - 多模态数据生成: user-guide/data-generation.md
      - 数据集管理: user-guide/datasets.md
      - 策略训练: user-guide/training.md
      - 评测、部署与反馈闭环: user-guide/evaluation-and-deployment.md
  - API 文档:
      - API 总览: api/index.md
      - 客户端与公共约定: api/client.md
      - 资产 API: api/assets.md
      - 场景与任务 API: api/scenes-and-tasks.md
      - 运行与数据生成 API: api/runs.md
      - 数据集 API: api/datasets.md
      - 训练 API: api/training.md
      - 评测、部署与反馈 API: api/evaluation-deployment-feedback.md
      - 领域模型: api/models.md
      - 扩展协议: api/plugins.md
      - 命令行: api/cli.md
      - 错误、状态与幂等: api/errors.md
  - 开发:
      - 开发总览: development/index.md
      - 架构与 SOLID 原则: development/architecture.md
      - 数据契约与可追溯性: development/data-contracts.md
      - 插件开发: development/plugin-development.md
      - 测试与质量门禁: development/testing.md

plugins:
  - search:
      lang:
        - zh

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bupt-yxp/PhysReal-X
      name: PhysReal-X 项目仓库

copyright: Copyright &copy; 2026 PhysReal-X 贡献者 · MIT 许可证
